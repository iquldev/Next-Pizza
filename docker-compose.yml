services:
  postgres:
    image: postgres:16-alpine
    container_name: next-pizza-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-next-pizza}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-next-pizza}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: next-pizza-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-next-pizza}?schema=public
      POSTGRES_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-next-pizza}?schema=public
      PRISMA_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-next-pizza}?schema=public
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-default_secret_please_change_in_production}
      DB_SEED: ${DB_SEED:-true}
    depends_on:
      postgres:
        condition: service_healthy

  studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: next-pizza-studio
    restart: unless-stopped
    profiles:
      - studio
    ports:
      - "127.0.0.1:5555:5555"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-next-pizza}?schema=public
    entrypoint: ["bun", "run", "db:studio"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
